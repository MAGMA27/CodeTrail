[project]
name = "codetrail-api"
version = "0.1.0"
description = "CodeTrail local API scaffold"
requires-python = ">=3.10,<3.14"
dependencies = [
    "arq>=0.26,<1",
    "fastapi==0.141.1",
    "mcp==2.2.0",
    "pydantic==2.13.5",
    "tomli>=2,<3; python_version < '3.11'",
    "uvicorn[standard]==0.52.4",
]

[project.scripts]
codetrail = "app.cli:main"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["*.cjs"]

[dependency-groups]
dev = [
    "import-linter==2.9",
    "pytest==9.1.1",
]

[tool.importlinter]
root_package = "app"
# Guarded imports are limited to annotation-only dependency injection types in main.py and factory.py.
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "HTTP and MCP adapters use the workspace service"
type = "forbidden"
source_modules = ["app.main", "app.mcp_server"]
forbidden_modules = [
    "app.storage",
    "app.github",
    "app.overview",
    "app.relations",
    "app.indexing",
    "app.journeys",
    "app.feature_graph",
    "app.impact_layers",
    "app.run_execution",
    "app.jobs",
    "app.worker",
    "app.feature_generation",
    "app.issue_analysis",
]
# The service layer necessarily imports these implementations. Indirect imports
# through app.service are the intended path; grimp cannot require that every
# indirect route passes through app.service, so this contract forbids direct imports.
allow_indirect_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Keep the lockfile on the public PyPI CDN so GitHub Actions (and other non-CN
# runners) are not pinned to a regional mirror that can time out.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
