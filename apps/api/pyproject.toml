[project]
name = "codetrail-api"
version = "0.1.0"
description = "CodeTrail local API scaffold"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "mcp==2.2.0",
    "pydantic==2.13.5",
    "uvicorn[standard]==0.52.4",
]

[project.scripts]
codetrail = "app.cli:main"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["*.cjs"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Keep the lockfile on the public PyPI CDN so GitHub Actions (and other non-CN
# runners) are not pinned to a regional mirror that can time out.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
